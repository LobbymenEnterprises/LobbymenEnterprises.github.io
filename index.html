<script>
  // Resolve color mode before first paint to avoid a flash of the wrong theme.
  // Mirrors the logic in src/context/ThemeContext.jsx.
  (function () {
    try {
      var stored = localStorage.getItem('lbmn-mode');
      var mode = (stored === 'light' || stored === 'dark')
        ? stored
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-mode', mode);
    } catch (e) {
      document.documentElement.setAttribute('data-mode', 'light');
    }
  })();
</script>
